<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="#ffffff"/>

  <text x="40" y="40" font-size="15" font-weight="600" fill="#0d47a1">Timeline (.hoodie/)</text>

  <!-- Instant boxes -->
  <g text-anchor="middle">
    <rect x="58"  y="64" width="124" height="84" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="120" y="88"  font-size="15" font-weight="700" fill="#004d40">t1</text>
    <text x="120" y="110" font-size="13.5" font-weight="600" fill="#004d40">commit</text>
    <text x="120" y="132" font-size="11.5" fill="#00695c">insert new rows</text>

    <rect x="198" y="64" width="124" height="84" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="260" y="88"  font-size="15" font-weight="700" fill="#004d40">t2</text>
    <text x="260" y="110" font-size="13.5" font-weight="600" fill="#004d40">deltacommit</text>
    <text x="260" y="132" font-size="11.5" fill="#00695c">updates → log.1</text>

    <rect x="338" y="64" width="124" height="84" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="400" y="88"  font-size="15" font-weight="700" fill="#004d40">t3</text>
    <text x="400" y="110" font-size="13.5" font-weight="600" fill="#004d40">deltacommit</text>
    <text x="400" y="132" font-size="11.5" fill="#00695c">updates → log.2</text>

    <rect x="478" y="64" width="124" height="84" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
    <text x="540" y="88"  font-size="15" font-weight="700" fill="#1b5e20">t4</text>
    <text x="540" y="110" font-size="13.5" font-weight="600" fill="#1b5e20">compaction</text>
    <text x="540" y="132" font-size="11.5" fill="#2e7d32">new base file</text>

    <rect x="618" y="64" width="124" height="84" rx="10" fill="#fff8e1" stroke="#fb8c00" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="680" y="88"  font-size="15" font-weight="700" fill="#e65100">t5</text>
    <text x="680" y="110" font-size="13.5" font-weight="600" fill="#e65100">deltacommit</text>
    <text x="680" y="132" font-size="11.5" fill="#ef6c00">write in progress</text>
  </g>

  <!-- connectors from boxes to axis -->
  <g stroke="#bbb" stroke-width="1.5">
    <line x1="120" y1="148" x2="120" y2="190"/>
    <line x1="260" y1="148" x2="260" y2="190"/>
    <line x1="400" y1="148" x2="400" y2="190"/>
    <line x1="540" y1="148" x2="540" y2="190"/>
    <line x1="680" y1="148" x2="680" y2="190"/>
  </g>

  <!-- Axis -->
  <line x1="50" y1="200" x2="770" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="224" text-anchor="end" font-size="12" fill="#757575">time</text>

  <g>
    <circle cx="120" cy="200" r="9" fill="#00897b"/>
    <circle cx="260" cy="200" r="9" fill="#00897b"/>
    <circle cx="400" cy="200" r="9" fill="#00897b"/>
    <circle cx="540" cy="200" r="9" fill="#43a047"/>
    <circle cx="680" cy="200" r="9" fill="#ffffff" stroke="#fb8c00" stroke-width="2.5"/>
  </g>

  <!-- State labels -->
  <g text-anchor="middle" font-size="12">
    <text x="120" y="232" fill="#00695c">✓ completed</text>
    <text x="260" y="232" fill="#00695c">✓ completed</text>
    <text x="400" y="232" fill="#00695c">✓ completed</text>
    <text x="540" y="232" fill="#2e7d32" font-weight="600">✓ completed</text>
    <text x="680" y="232" fill="#ef6c00">… inflight</text>
  </g>

  <!-- Reader -->
  <rect x="150" y="300" width="500" height="84" rx="10" fill="#ede7f6" stroke="#7e57c2" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" font-size="15" font-weight="600" fill="#311b92">Reader</text>
  <text x="400" y="347" text-anchor="middle" font-size="12.5" fill="#4527a0">latest completed instant = t4 → read the file slices as of t4</text>
  <text x="400" y="367" text-anchor="middle" font-size="12.5" fill="#4527a0">t5 is still inflight, so its files are ignored</text>

  <line x1="540" y1="298" x2="540" y2="244" stroke="#7e57c2" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="400" y="424" text-anchor="middle" font-size="12" fill="#757575">Every action moves through requested → inflight → completed.</text>
  <text x="400" y="444" text-anchor="middle" font-size="12" fill="#757575">Only completed instants are visible to readers.</text>
</svg>