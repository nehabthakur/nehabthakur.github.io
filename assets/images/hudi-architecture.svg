<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="#ffffff"/>

  <!-- Top row: CDC pipeline -->
  <g text-anchor="middle">
    <rect x="15" y="30" width="180" height="84" rx="10" fill="#f5f5f5" stroke="#757575" stroke-width="2"/>
    <text x="105" y="56" font-size="15" font-weight="600" fill="#212121">Source database</text>
    <text x="105" y="78" font-size="12" fill="#424242">MySQL / PostgreSQL</text>
    <text x="105" y="97" font-size="11.5" fill="#616161">inserts, updates, deletes</text>

    <rect x="212" y="30" width="180" height="84" rx="10" fill="#fce4ec" stroke="#d81b60" stroke-width="2"/>
    <text x="302" y="56" font-size="15" font-weight="600" fill="#880e4f">Debezium (CDC)</text>
    <text x="302" y="78" font-size="12" fill="#ad1457">reads the database's</text>
    <text x="302" y="97" font-size="11.5" fill="#ad1457">change log</text>

    <rect x="409" y="30" width="180" height="84" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="499" y="56" font-size="15" font-weight="600" fill="#e65100">Kafka topic</text>
    <text x="499" y="78" font-size="12" fill="#ef6c00">stream of change events</text>
    <text x="499" y="97" font-size="11.5" fill="#ef6c00">(one per changed row)</text>

    <rect x="606" y="30" width="180" height="84" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
    <text x="696" y="56" font-size="15" font-weight="600" fill="#1b5e20">Hudi writer</text>
    <text x="696" y="78" font-size="11.5" fill="#2e7d32">Hudi Streamer, Spark or Flink</text>
    <text x="696" y="97" font-size="11.5" fill="#2e7d32">upserts by record key</text>
  </g>

  <!-- S3 -->
  <rect x="520" y="196" width="266" height="112" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="653" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#004d40">S3: base path</text>
  <text x="540" y="248" font-size="12.5" fill="#00695c">.hoodie/   timeline + metadata table</text>
  <text x="540" y="270" font-size="12.5" fill="#00695c">country=US/  country=UK/  …</text>
  <text x="540" y="292" font-size="12.5" fill="#00695c">file groups → file slices</text>

  <!-- Catalog -->
  <rect x="210" y="210" width="230" height="78" rx="10" fill="#ede7f6" stroke="#7e57c2" stroke-width="2"/>
  <text x="325" y="238" text-anchor="middle" font-size="15" font-weight="600" fill="#311b92">Glue Data Catalog</text>
  <text x="325" y="260" text-anchor="middle" font-size="12" fill="#4527a0">schema, partitions + base path</text>
  <text x="325" y="278" text-anchor="middle" font-size="11.5" fill="#4527a0">(kept up to date by meta sync)</text>

  <!-- Query engines -->
  <rect x="210" y="370" width="230" height="70" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="325" y="398" text-anchor="middle" font-size="15" font-weight="600" fill="#0d47a1">Query engines</text>
  <text x="325" y="420" text-anchor="middle" font-size="12.5" fill="#1565c0">Athena / Trino / Spark</text>

  <!-- Arrows -->
  <g stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="195" y1="72" x2="210" y2="72"/>
    <line x1="392" y1="72" x2="407" y2="72"/>
    <line x1="589" y1="72" x2="604" y2="72"/>
    <line x1="696" y1="114" x2="696" y2="194"/>
    <line x1="325" y1="368" x2="325" y2="290"/>
    <line x1="440" y1="400" x2="560" y2="310"/>
  </g>
  <line x1="640" y1="114" x2="420" y2="208" stroke="#7e57c2" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrow labels -->
  <text x="686" y="160" text-anchor="end" font-size="12" fill="#424242">write files +</text>
  <text x="686" y="176" text-anchor="end" font-size="12" fill="#424242">commit to timeline</text>
  <text x="462" y="160" font-size="12" fill="#5e35b1">meta sync</text>
  <text x="335" y="334" font-size="12" fill="#424242">1. look up table</text>
  <text x="508" y="372" font-size="12" fill="#424242">2. read timeline,</text>
  <text x="508" y="388" font-size="12" fill="#424242">then file slices</text>
</svg>