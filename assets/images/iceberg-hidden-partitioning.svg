<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bbb"/>
    </marker>
  </defs>

  <rect width="800" height="560" fill="#ffffff"/>

  <!-- Query -->
  <rect x="190" y="20" width="420" height="60" rx="10" fill="#ede7f6" stroke="#7e57c2" stroke-width="2"/>
  <text x="400" y="45" text-anchor="middle" font-size="15" font-weight="600" fill="#311b92">SELECT … WHERE ts is on 2026-11-02</text>
  <text x="400" y="67" text-anchor="middle" font-size="12.5" fill="#4527a0">Iceberg turns this into: ts_day = 2026-11-02</text>

  <!-- Manifest list -->
  <rect x="250" y="120" width="300" height="60" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="400" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#004d40">manifest list (current snapshot)</text>
  <text x="400" y="167" text-anchor="middle" font-size="12.5" fill="#00695c">ts_day range for each manifest</text>

  <!-- Manifests -->
  <rect x="40" y="240" width="220" height="74" rx="10" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
  <text x="150" y="264" text-anchor="middle" font-size="15" font-weight="600" fill="#9e9e9e">manifest C</text>
  <text x="150" y="284" text-anchor="middle" font-size="12.5" fill="#9e9e9e">ts_day: 10-30 → 10-31</text>
  <text x="150" y="303" text-anchor="middle" font-size="12" fill="#9e9e9e">commit 1 · skipped</text>

  <rect x="290" y="240" width="220" height="74" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="400" y="264" text-anchor="middle" font-size="15" font-weight="600" fill="#1b5e20">manifest A</text>
  <text x="400" y="284" text-anchor="middle" font-size="12.5" fill="#2e7d32">ts_day: 11-01 → 11-02</text>
  <text x="400" y="303" text-anchor="middle" font-size="12" fill="#2e7d32">commit 2 · opened</text>

  <rect x="540" y="240" width="220" height="74" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="650" y="264" text-anchor="middle" font-size="15" font-weight="600" fill="#1b5e20">manifest B</text>
  <text x="650" y="284" text-anchor="middle" font-size="12.5" fill="#2e7d32">ts_day: 11-02 → 11-03</text>
  <text x="650" y="303" text-anchor="middle" font-size="12" fill="#2e7d32">commit 3 · opened</text>

  <!-- Data files -->
  <g font-size="13" text-anchor="middle">
    <rect x="33"  y="380" width="110" height="58" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
    <text x="88"  y="404" fill="#9e9e9e">file1.parquet</text>
    <text x="88"  y="424" font-size="11.5" fill="#9e9e9e">ts_day=10-30</text>
    <rect x="157" y="380" width="110" height="58" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
    <text x="212" y="404" fill="#9e9e9e">file2.parquet</text>
    <text x="212" y="424" font-size="11.5" fill="#9e9e9e">ts_day=10-31</text>

    <rect x="283" y="380" width="110" height="58" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
    <text x="338" y="404" fill="#9e9e9e">file3.parquet</text>
    <text x="338" y="424" font-size="11.5" fill="#9e9e9e">ts_day=11-01</text>
    <rect x="407" y="380" width="110" height="58" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="3"/>
    <text x="462" y="404" fill="#e65100" font-weight="600">file4.parquet</text>
    <text x="462" y="424" font-size="11.5" fill="#e65100">ts_day=11-02</text>

    <rect x="533" y="380" width="110" height="58" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="3"/>
    <text x="588" y="404" fill="#e65100" font-weight="600">file5.parquet</text>
    <text x="588" y="424" font-size="11.5" fill="#e65100">ts_day=11-02</text>
    <rect x="657" y="380" width="110" height="58" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
    <text x="712" y="404" fill="#9e9e9e">file6.parquet</text>
    <text x="712" y="424" font-size="11.5" fill="#9e9e9e">ts_day=11-03</text>
  </g>

  <!-- Skipped paths -->
  <g stroke="#bbb" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-grey)">
    <line x1="320" y1="180" x2="170" y2="238"/>
    <line x1="125" y1="314" x2="95"  y2="378"/>
    <line x1="175" y1="314" x2="205" y2="378"/>
    <line x1="375" y1="314" x2="345" y2="378"/>
    <line x1="675" y1="314" x2="705" y2="378"/>
  </g>

  <!-- Read paths -->
  <g stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="400" y1="80"  x2="400" y2="118"/>
    <line x1="400" y1="180" x2="400" y2="238"/>
    <line x1="480" y1="180" x2="630" y2="238"/>
    <line x1="425" y1="314" x2="455" y2="378"/>
    <line x1="625" y1="314" x2="595" y2="378"/>
  </g>

  <!-- Legend -->
  <rect x="215" y="470" width="18" height="14" rx="3" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="241" y="482" font-size="12.5" fill="#424242">read</text>
  <rect x="300" y="470" width="18" height="14" rx="3" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
  <text x="326" y="482" font-size="12.5" fill="#424242">skipped using metadata, never opened</text>

  <text x="400" y="518" text-anchor="middle" font-size="12" fill="#757575">Files for 2026-11-02 were written by different commits, so they sit in different manifests.</text>
  <text x="400" y="538" text-anchor="middle" font-size="12" fill="#757575">ts_day is stored only in the manifest entries, not as a column in the Parquet files.</text>
</svg>